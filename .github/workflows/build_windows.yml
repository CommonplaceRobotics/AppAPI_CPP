# Vorbedingung:
# - Die Conan-Lockdatei (conan_windows.lock) muss existieren.

name: Build and Test for Windows

on:
  push:
    branches: [ "main", "v1*", "v2*", "v3*" ]
  pull_request:
    branches: [ "main", "v1*", "v2*", "v3*" ]

jobs:
  # Bereitet die Abhängigkeiten für Windows vor.
  # Dies ist ein separater Job, da dies sehr lange dauern (30-60 Min, falls alles gebaut werden muss) kann und das Ergebnis gecached werden soll, auch wenn das Bauen später fehlschlägt.
  build_dependencies:
    runs-on: CPR_Windows11
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v7
    - uses: CommonplaceRobotics/Action_Build_Conan_Dependencies/Windows@v2
      with:
        lockfile: 'conan_windows.lock'
        cache_key: conan-${{ runner.os }}-${{ hashFiles('conan_windows.lock', 'conanfile.py') }}


  # Build and run tests for Windows
  test:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: build_dependencies

    steps:
    - uses: actions/checkout@v7

    # Get the MSVC environment
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Restore cached dependencies
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.conan2
          out
        key: conan-${{ runner.os }}-${{ hashFiles('conan_windows.lock', 'conanfile.py') }}
        fail-on-cache-miss: true

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Configure CMake
      run: |
        cp .github\workflows\CMakePresets_Windows.json CMakePresets.json
        cmake --preset conan-windows-x86_64-release

    - name: Build Tests
      run: |
        cd out/build/Windows/Release
        cmake --build . --target iRCApp_Tests.exe

    - name: Run Tests
      run: |
        cd out/build/Windows/Release
        ./iRCApp_Tests.exe

    - name: Export Library
      uses: actions/upload-artifact@v7
      with:
        path: out/build/Windows/Release/iRCApp.lib
        archive: false

    - name: Export CMake build directory for SBOM
      uses: actions/upload-artifact@v7
      with:
        name: INTERNAL_CMake_build_dir
        path: out/build


  # SBOM step 1: Create initial SBOM on Windows. This step could be merged with 'build', but splitting enables faster debugging re-runs.
  sbom_pt1:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: build_dependencies

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Create incomplete SBOM
      uses: CommonplaceRobotics/Action_Create_Conan_SBOM@v4
      with:
        lockfile: conan_windows.lock
        sbom: sbom_temp1.cdx.json
        conan_params: '--profile=cpr_windows_x86_64_release'

    - name: Export incomplete SBOM
      uses: actions/upload-artifact@v7
      with:
        path: sbom_temp1.cdx.json
        archive: false


  # Creates the SBOM and checks its compliance
  # sbomify requires this to run on Linux but loading the Cache is not possible due to files in ~
  sbom_pt2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sbom_pt1

    steps:
    - uses: actions/checkout@v7

    - name: Import incomplete SBOM
      uses: actions/download-artifact@v8
      with:
        name: sbom_temp1.cdx.json

    # We need the generated sbomify.json
    - name: Import CMake build dir
      uses: actions/download-artifact@v8
      with:
        name: INTERNAL_CMake_build_dir
        path: out/build

    - name: Move sbomify.json
      run: mv out/build/Windows/Release/sbomify.json .

    # Liest die Core-Version aus CMakeLists.txt
    - name: Get software version
      run: |
        VER=`grep -E -o "VERSION[[:blank:]]+[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+" CMakeLists.txt | sed "s/[^0-9.]*//g"`
        echo "Software version '$VER' detected"
        echo "SW_VERSION=$VER" >> $GITHUB_ENV

    - name: Enrich and Augment SBOM
      uses: sbomify/sbomify-action@master
      env:
        SBOM_FILE: sbom_temp1.cdx.json
        OUTPUT_FILE: sbom_temp2.cdx.json
        COMPONENT_NAME: AppAPI_CPP
        COMPONENT_VERSION: ${{ env.SW_VERSION }}
        # Produkt- und Firmeninfo werden aus sbomify.json geladen
        AUGMENT: true
        # Metadaten aus Paket-Registry hinzufügen
        ENRICH: true
        # Metadaten aus additional_packages_rpi.txt hinzufügen
        ADDITIONAL_PACKAGES_FILE: additional_packages_rpi.txt
        UPLOAD: false

    - name: Export incomplete SBOM
      uses: actions/upload-artifact@v7
      with:
        path: sbom_temp2.cdx.json
        archive: false


  # Complete the SBOM on Windows where we can access the cache
  sbom_pt3:
    runs-on: CPR_Windows11
    timeout-minutes: 15
    needs: sbom_pt2

    steps:
    - uses: actions/checkout@v7

    - name: Restore cached dependencies
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.conan2
          out
        key: conan-${{ runner.os }}-${{ hashFiles('conan_windows.lock', 'conanfile.py') }}
        fail-on-cache-miss: true

    # This loads the build dir including the library
    # We need the library to calculate its hash
    - name: Import CMake build dir
      uses: actions/download-artifact@v8
      with:
        name: INTERNAL_CMake_build_dir
        path: out/build

    - name: Import incomplete SBOM
      uses: actions/download-artifact@v8
      with:
        name: sbom_temp2.cdx.json

    - name: Final SBOM enrichment
      uses: CommonplaceRobotics/Action_SBOM_Enrichment@v7
      with:
        database: .github/workflows/sbom_enrichment_db.json
        sbom: sbom_temp2.cdx.json
        sbom_out: sbom_windows.cdx.json
        cmake_build_dir: out/build/Windows/Release

    - name: Export SBOM
      uses: actions/upload-artifact@v7
      with:
        path: sbom_windows.cdx.json
        archive: false


  sbom_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sbom_pt3

    steps:
    - name: Import SBOM
      uses: actions/download-artifact@v8
      with:
        name: sbom_windows.cdx.json

    - name: Validate SBOM with company policies
      uses: CommonplaceRobotics/SW_Validate_SBOM@v5
      with:
        sbom: sbom_windows.cdx.json
